on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          # node:test needs >= 18
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm i
      - run: npm run lint
      # `deploy` is `npm test && npm publish`, so a red test blocks the publish.
      - run: npm run deploy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
